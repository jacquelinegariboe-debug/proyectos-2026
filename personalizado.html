

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fresseni | Personalizado</title>

    <link rel="stylesheet" href="stylesheetpersonalizado.css">
</head>

<body>

    <div class="promocion">
        ¿Y si hoy tu antojo tiene sabor a fresa? 🍓
    </div>

    <header>
    <nav>
        <a href="index.html" class="logo-link">
            <img src="./imagenes/Logo fresseni.png" alt="Logo Fresseni" class="logo">
        </a>

        <a href="menu.html">Menú</a>
        <a href="sucursales.html">Sucursales</a>
        <a href="personalizado.html">Personaliza</a>
    </nav>
</header>

    <main class="contenedor-pedido">

        <h1>Tu pedido ♡</h1>

        <p class="subtitulo">
            Tus antojos favoritos están aquí
        </p>

        <div class="contenido-pedido">

            <section class="lista-productos">

                <h2>Mis productos</h2>

                <div id="productos-carrito">

                </div>

            </section>

            <section class="resumen-pedido">

                <h2>Resumen de compra</h2>

                <div class="detalle-total">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>

                <div class="linea"></div>

                <div class="detalle-total total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>

                <button id="confirmar-pedido">
                    Confirmar pedido ♡
                </button>

                <a href="menu.html" class="seguir-comprando">
                    Seguir comprando
                </a>

            </section>

        </div>

    </main>

    <script src="carrito.js"></script>

</body>

</html>
